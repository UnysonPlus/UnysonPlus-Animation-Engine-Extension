<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 78" role="img" aria-label="Tilt 3D">
  <style>
    .tilt-g{transform-box:fill-box;transform-origin:center;animation:tilt-k 2.6s ease-in-out infinite}
    @keyframes tilt-k{0%,15%{transform:perspective(160px) rotateX(55deg);opacity:0}55%,100%{transform:perspective(160px) rotateX(0deg);opacity:1}}
  </style>
  <defs><clipPath id="tilt-c"><rect x="40" y="10" width="52" height="44" rx="5"/></clipPath></defs>
  <g clip-path="url(#tilt-c)">
    <rect x="40" y="10" width="52" height="44" fill="#7b90ff"/><path d="M40 54 L58 34 L72 46 L92 30 L92 54 Z" fill="#7b90ff"/>
    <g class="tilt-g"><rect x="40" y="10" width="52" height="44" fill="#3858e9"/><circle cx="66" cy="26" r="6" fill="#fbbf24"/><path d="M40 54 L52 40 L66 50 L82 34 L92 54 Z" fill="#3858e9"/></g>
  </g>
  
</svg>
