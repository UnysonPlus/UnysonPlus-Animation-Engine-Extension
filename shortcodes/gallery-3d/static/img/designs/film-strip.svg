<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
  <defs>
    <linearGradient id="fs-f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b90ff"/><stop offset="1" stop-color="#3858e9"/>
    </linearGradient>
  </defs>
  <!-- Film Strip: a horizontal cover-flow carousel — centre card flat/forward, sides curve back. -->
