    </rect>
    <rect x="-13" y="-13.0" width="26" height="26" rx="3" fill="url(#fs-f)" transform="translate(17 32)">
      <animateTransform attributeName="transform" type="translate" dur="4s" begin="0s" repeatCount="indefinite" additive="sum" keyTimes="0;1" values="0 0;-30 0"/>
    </rect>
    <rect x="-13" y="-13.0" width="26" height="26" rx="3" fill="url(#fs-f)" transform="translate(47 32)">
      <animateTransform attributeName="transform" type="translate" dur="4s" begin="0s" repeatCount="indefinite" additive="sum" keyTimes="0;1" values="0 0;-30 0"/>
    </rect>
    <rect x="-13" y="-13.0" width="26" height="26" rx="3" fill="url(#fs-f)" transform="translate(77 32)">
      <animateTransform attributeName="transform" type="translate" dur="4s" begin="0s" repeatCount="indefinite" additive="sum" keyTimes="0;1" values="0 0;-30 0"/>
