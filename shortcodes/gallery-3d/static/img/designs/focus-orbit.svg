<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs><linearGradient id="fo-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient></defs>
<!-- Focus Orbit: small cards orbit a central hero card. Original design. -->
<g transform="translate(48,32)">
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="6s" repeatCount="indefinite" from="0" to="360"/>
    <rect x="23.0" y="-4.0" width="8" height="8" rx="2" fill="url(#fo-f)" opacity="0.8"/>
    <rect x="9.5" y="6.4" width="8" height="8" rx="2" fill="url(#fo-f)" opacity="0.8"/>
    <rect x="-17.5" y="6.4" width="8" height="8" rx="2" fill="url(#fo-f)" opacity="0.8"/>
    <rect x="-31.0" y="-4.0" width="8" height="8" rx="2" fill="url(#fo-f)" opacity="0.8"/>
    <rect x="-17.5" y="-14.4" width="8" height="8" rx="2" fill="url(#fo-f)" opacity="0.8"/>
    <rect x="9.5" y="-14.4" width="8" height="8" rx="2" fill="url(#fo-f)" opacity="0.8"/>
  </g>
  <rect x="-12" y="-12" width="24" height="24" rx="3" fill="url(#fo-f)"><animate attributeName="opacity" dur="3s" repeatCount="indefinite" keyTimes="0;0.5;1" values="0.85;1;0.85"/></rect>
