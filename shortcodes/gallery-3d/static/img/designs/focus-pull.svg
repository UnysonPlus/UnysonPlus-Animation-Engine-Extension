<g filter="url(#b2)" opacity=".85"><rect x="10" y="24" width="12" height="12" rx="2" fill="url(#A)"/><rect x="38" y="27" width="12" height="12" rx="2" fill="url(#A)"/><rect x="70" y="22" width="12" height="12" rx="2" fill="url(#A)"/></g>
<g filter="url(#b1)"><rect x="22" y="40" width="16" height="16" rx="2.5" fill="url(#A)"/><rect x="55" y="42" width="16" height="16" rx="2.5" fill="url(#A)"/></g>
