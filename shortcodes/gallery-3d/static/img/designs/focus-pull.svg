<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs><linearGradient id="A" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient><filter id="b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" dur="4.5s" repeatCount="indefinite" values="0;1.6;2.6;1.6;0"/></feGaussianBlur></filter><filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" dur="4.5s" repeatCount="indefinite" values="1.6;0;1.6;0;1.6"/></feGaussianBlur></filter><filter id="b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" dur="4.5s" repeatCount="indefinite" values="2.6;1.6;0;1.6;2.6"/></feGaussianBlur></filter></defs>
<!-- Focus Pull: photos at three depths; the focus racks from front to back and back again. Original design. -->
