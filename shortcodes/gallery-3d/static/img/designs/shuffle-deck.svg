<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs><linearGradient id="A" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient></defs>
<!-- Shuffle Deck: the top photo slides out to the side and tucks back in at the bottom while the rest move up. Original design. -->
<!-- the card tucking in at the bottom of the deck (shown only for the second half) -->
<g opacity="0"><animate attributeName="opacity" dur="3s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.42;1" values="0;1;1"/>
<animateTransform attributeName="transform" type="translate" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.42;0.7;1" keySplines="0 0 1 1;.45 0 .55 1;0 0 1 1" values="30 -3;30 -3;12 -12;12 -12"/>
<rect x="28" y="20" width="32" height="24" rx="3" fill="url(#A)" stroke="#fff" stroke-width="1"/></g>
<!-- the deck: each card moves up one place while the top card is out -->
<g><animateTransform attributeName="transform" type="translate" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.42;0.7;1" keySplines="0 0 1 1;.45 0 .55 1;0 0 1 1" values="0 0;0 0;-4 4;-4 4"/>
<rect x="40" y="8" width="32" height="24" rx="3" fill="url(#A)" stroke="#fff" stroke-width="1"/>
<rect x="36" y="12" width="32" height="24" rx="3" fill="url(#A)" stroke="#fff" stroke-width="1"/>
<rect x="32" y="16" width="32" height="24" rx="3" fill="url(#A)" stroke="#fff" stroke-width="1"/></g>
<!-- the top card sliding out (shown only for the first half) -->
<g><animate attributeName="opacity" dur="3s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.42;1" values="1;0;0"/>
<animateTransform attributeName="transform" type="translate" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.1;0.42;1" keySplines="0 0 1 1;.45 0 .55 1;0 0 1 1" values="0 0;0 0;30 -3;30 -3"/>
<rect x="28" y="20" width="32" height="24" rx="3" fill="url(#A)" stroke="#fff" stroke-width="1"/></g>
</svg>
