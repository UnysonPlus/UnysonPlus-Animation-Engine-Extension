<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs><linearGradient id="ob-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient></defs>
<!-- Orbit Bloom: a ring of cards breathing open and closed while it slowly turns. Original design. -->
<g transform="translate(48,32)">
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="7s" repeatCount="indefinite" from="0" to="360"/>
    <g>
      <animateTransform attributeName="transform" type="scale" additive="sum" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.5;1" values="0.26;1;0.26"/>
      <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.5;1" values="0.5;1;0.5"/>
      <rect x="21.0" y="-5.0" width="10" height="10" rx="2" fill="url(#ob-f)"/>
      <rect x="11.2" y="5.2" width="10" height="10" rx="2" fill="url(#ob-f)"/>
      <rect x="-10.8" y="7.7" width="10" height="10" rx="2" fill="url(#ob-f)"/>
      <rect x="-28.4" y="0.6" width="10" height="10" rx="2" fill="url(#ob-f)"/>
      <rect x="-28.4" y="-10.6" width="10" height="10" rx="2" fill="url(#ob-f)"/>
      <rect x="-10.8" y="-17.7" width="10" height="10" rx="2" fill="url(#ob-f)"/>
      <rect x="11.2" y="-15.2" width="10" height="10" rx="2" fill="url(#ob-f)"/>
    </g>
  </g>
</g>
</svg>
