<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs>
  <linearGradient id="in-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient>
  <path id="in-p" d="M48,32 C58,18 82,18 82,32 C82,46 58,46 48,32 C38,18 14,18 14,32 C14,46 38,46 48,32 Z"/>
</defs>
<!-- Infinity Orbit: cards looping a figure-eight, one pass crossing over the other. Original design. -->
<use href="#in-p" stroke="#8fbcff" stroke-opacity=".4" stroke-width="1.4"/>
<g>
  <rect x="-5" y="-5" width="10" height="10" rx="2" fill="url(#in-f)"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#in-p"/></animateMotion></rect>
  <rect x="-5" y="-5" width="10" height="10" rx="2" fill="url(#in-f)" opacity=".85"><animateMotion dur="5s" begin="-1.25s" repeatCount="indefinite"><mpath href="#in-p"/></animateMotion></rect>
  <rect x="-5" y="-5" width="10" height="10" rx="2" fill="url(#in-f)" opacity=".75"><animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite"><mpath href="#in-p"/></animateMotion></rect>
  <rect x="-5" y="-5" width="10" height="10" rx="2" fill="url(#in-f)" opacity=".85"><animateMotion dur="5s" begin="-3.75s" repeatCount="indefinite"><mpath href="#in-p"/></animateMotion></rect>
</g>
</svg>
