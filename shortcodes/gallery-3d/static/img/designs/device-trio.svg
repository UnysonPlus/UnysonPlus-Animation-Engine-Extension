<rect x="24" y="8" width="48" height="31" rx="2.5" fill="#1c1c1f"/><rect x="26.5" y="10.5" width="43" height="26" fill="url(#A)"/>
<rect x="26.5" y="10.5" width="43" height="26" fill="url(#B)"><animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" keyTimes="0;0.3;0.4;0.9;1" values="0;0;1;1;0"/></rect>
<path d="M19 39h58l-3 4H22z" fill="#b6bac2"/></g>
<g><animateTransform attributeName="transform" type="translate" dur="2.6s" repeatCount="indefinite" values="0 0;0 2;0 0"/>
<rect x="10" y="26" width="20" height="27" rx="3" fill="#16161a"/><rect x="12.5" y="28.5" width="15" height="22" rx="1" fill="url(#B)"/>
<rect x="12.5" y="28.5" width="15" height="22" rx="1" fill="url(#A)"><animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" keyTimes="0;0.55;0.65;0.95;1" values="0;0;1;1;0"/></rect></g>
<g><animateTransform attributeName="transform" type="translate" dur="2.9s" repeatCount="indefinite" values="0 1;0 -1;0 1"/>
<rect x="70" y="28" width="12" height="24" rx="3" fill="#0d0d11"/><rect x="71.8" y="29.8" width="8.4" height="20.4" rx="1.6" fill="url(#A)"/>
<rect x="71.8" y="29.8" width="8.4" height="20.4" rx="1.6" fill="url(#B)"><animate attributeName="opacity" dur="4.8s" repeatCount="indefinite" keyTimes="0;0.8;0.9;1" values="1;1;0;0"/></rect></g>
</svg>
