<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs><linearGradient id="A" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient><linearGradient id="B" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7de2c8"/><stop offset="1" stop-color="#1fa385"/></linearGradient></defs>
<!-- Device Trio: a laptop with a tablet and a phone floating in front; the screens change in turn. Original design. -->
