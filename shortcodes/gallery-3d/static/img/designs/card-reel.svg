        <animateTransform attributeName="transform" type="translate" dur="4s" begin="0s" repeatCount="indefinite" additive="sum" keyTimes="0;1" values="0 0;0 -30"/>
      </rect>
    </g>
    <g>
      <rect x="-15.0" y="-11" width="30" height="22" rx="3" fill="url(#cr-f)" transform="translate(48 17)">
        <animateTransform attributeName="transform" type="translate" dur="4s" begin="0s" repeatCount="indefinite" additive="sum" keyTimes="0;1" values="0 0;0 -30"/>
      </rect>
    </g>
    <g>
      <rect x="-15.0" y="-11" width="30" height="22" rx="3" fill="url(#cr-f)" transform="translate(48 47)">
        <animateTransform attributeName="transform" type="translate" dur="4s" begin="0s" repeatCount="indefinite" additive="sum" keyTimes="0;1" values="0 0;0 -30"/>
      </rect>
    </g>
    <g>
      <rect x="-15.0" y="-11" width="30" height="22" rx="3" fill="url(#cr-f)" transform="translate(48 77)">
        <animateTransform attributeName="transform" type="translate" dur="4s" begin="0s" repeatCount="indefinite" additive="sum" keyTimes="0;1" values="0 0;0 -30"/>
      </rect>
    </g>
  <animateTransform attributeName="transform" type="translate" dur="4s" begin="0s" repeatCount="indefinite" keyTimes="0;1" values="0 0;0 0"/></g></g>
  <rect x="0" y="0" width="96" height="64" fill="url(#cr-fade)" opacity="0"/>
</svg>
