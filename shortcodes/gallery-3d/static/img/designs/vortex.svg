<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs>
  <linearGradient id="vx-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient>
  <radialGradient id="vx-e"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#9cc4ff" stop-opacity=".8"/><stop offset="1" stop-color="#2f74e6" stop-opacity="0"/></radialGradient>
