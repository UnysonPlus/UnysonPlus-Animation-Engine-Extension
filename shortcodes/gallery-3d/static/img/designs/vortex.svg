<!-- Vortex: cards spiralling in along arms to a glowing eye, shrinking as they sink. Original design. -->
<circle cx="48" cy="32" r="9" fill="url(#vx-e)"/>
<g transform="translate(48,32) scale(1,0.62) translate(-48,-32)">
