    <g>
      <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="url(#vx-f)"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#vx-a"/></animateMotion>
        <animateTransform attributeName="transform" type="scale" additive="sum" dur="3s" repeatCount="indefinite" values="1;0.25"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.8;1"/></rect>
      <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="url(#vx-f)"><animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite"><mpath href="#vx-a"/></animateMotion>
        <animateTransform attributeName="transform" type="scale" additive="sum" dur="3s" begin="-1.5s" repeatCount="indefinite" values="1;0.25"/><animate attributeName="opacity" dur="3s" begin="-1.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.8;1"/></rect>
    </g>
    <g transform="rotate(120 48 32)">
      <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="url(#vx-f)"><animateMotion dur="3s" begin="-0.5s" repeatCount="indefinite"><mpath href="#vx-a"/></animateMotion>
        <animateTransform attributeName="transform" type="scale" additive="sum" dur="3s" begin="-0.5s" repeatCount="indefinite" values="1;0.25"/><animate attributeName="opacity" dur="3s" begin="-0.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.8;1"/></rect>
      <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="url(#vx-f)"><animateMotion dur="3s" begin="-2s" repeatCount="indefinite"><mpath href="#vx-a"/></animateMotion>
        <animateTransform attributeName="transform" type="scale" additive="sum" dur="3s" begin="-2s" repeatCount="indefinite" values="1;0.25"/><animate attributeName="opacity" dur="3s" begin="-2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.8;1"/></rect>
    </g>
    <g transform="rotate(240 48 32)">
      <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="url(#vx-f)"><animateMotion dur="3s" begin="-1s" repeatCount="indefinite"><mpath href="#vx-a"/></animateMotion>
        <animateTransform attributeName="transform" type="scale" additive="sum" dur="3s" begin="-1s" repeatCount="indefinite" values="1;0.25"/><animate attributeName="opacity" dur="3s" begin="-1s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.8;1"/></rect>
      <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="url(#vx-f)"><animateMotion dur="3s" begin="-2.5s" repeatCount="indefinite"><mpath href="#vx-a"/></animateMotion>
        <animateTransform attributeName="transform" type="scale" additive="sum" dur="3s" begin="-2.5s" repeatCount="indefinite" values="1;0.25"/><animate attributeName="opacity" dur="3s" begin="-2.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.8;1"/></rect>
    </g>
  </g>
