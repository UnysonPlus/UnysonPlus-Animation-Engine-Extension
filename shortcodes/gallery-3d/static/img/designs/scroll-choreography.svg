<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" role="img" aria-label="Scroll Choreography">
  <rect width="160" height="100" rx="8" fill="#0f1420"/>
  <!-- stack (left) -->
  <g opacity="0.95">
    <rect x="16" y="40" width="26" height="34" rx="3" fill="#2f74e6" opacity="0.5" transform="rotate(-8 29 57)"/>
    <rect x="19" y="37" width="26" height="34" rx="3" fill="#2f74e6" opacity="0.7" transform="rotate(4 32 54)"/>
    <rect x="22" y="34" width="26" height="34" rx="3" fill="#2ad38b"/>
  </g>
  <!-- arrow -->
  <path d="M58 52 h30" stroke="#5b6b7b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <!-- arc / formed (right) -->
  <g>
    <rect x="96"  y="44" width="20" height="28" rx="3" fill="#2f74e6" opacity="0.55" transform="rotate(-22 106 58)"/>
    <rect x="114" y="38" width="20" height="28" rx="3" fill="#2ad38b"/>
    <rect x="132" y="44" width="20" height="28" rx="3" fill="#2f74e6" opacity="0.55" transform="rotate(22 142 58)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#5b6b7b"/></marker>
  </defs>
</svg>
