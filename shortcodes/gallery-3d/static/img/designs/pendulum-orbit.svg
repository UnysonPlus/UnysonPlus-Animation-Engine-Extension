<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs><linearGradient id="pe-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient></defs>
<!-- Pendulum Orbit: an arc of cards swinging back and forth, easing at each end. Original design. -->
<g transform="translate(48,20) scale(1,0.55)">
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="-35;35;-35"/>
    <rect x="-5" y="27" width="10" height="16" rx="2" fill="url(#pe-f)" transform="rotate(-50)" opacity=".6"/>
    <rect x="-5" y="27" width="10" height="16" rx="2" fill="url(#pe-f)" transform="rotate(-25)" opacity=".8"/>
    <rect x="-6" y="28" width="12" height="18" rx="2" fill="url(#pe-f)"/>
    <rect x="-5" y="27" width="10" height="16" rx="2" fill="url(#pe-f)" transform="rotate(25)" opacity=".8"/>
    <rect x="-5" y="27" width="10" height="16" rx="2" fill="url(#pe-f)" transform="rotate(50)" opacity=".6"/>
  </g>
</g>
</svg>
