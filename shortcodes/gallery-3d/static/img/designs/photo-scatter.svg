<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
  <!-- Photo Scatter: a loose pile of tilted, overlapping photos on a table — a few glide in from the
       edges and settle (the scatter), reading unmistakably as a scattered set, not a ring. Each card
       is a white-framed colour tile at its own angle; the two outer cards ease in on a short loop so
       the tile animates in the picker while still reading clearly when static. -->
  <defs>
    <linearGradient id="ps-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd36e"/><stop offset="1" stop-color="#f5a623"/></linearGradient>
    <linearGradient id="ps-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient>
    <linearGradient id="ps-c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a8b"/><stop offset="1" stop-color="#e5484d"/></linearGradient>
    <linearGradient id="ps-d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ce6b0"/><stop offset="1" stop-color="#18a058"/></linearGradient>
    <linearGradient id="ps-e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d0b3ff"/><stop offset="1" stop-color="#8a5cf6"/></linearGradient>
  </defs>
  <!-- a photo = white frame (rect) + a colour "image" inset, grouped and rotated about its centre -->
  <g stroke="#ffffff" stroke-width="0" >
    <!-- back-left -->
    <g transform="rotate(-16 26 40)">
      <rect x="12" y="27" width="28" height="26" rx="2" fill="#ffffff"/>
      <rect x="14.5" y="29.5" width="23" height="18" rx="1" fill="url(#ps-d)"/>
    </g>
    <!-- back-right -->
    <g transform="rotate(14 70 26)">
      <rect x="56" y="12" width="28" height="26" rx="2" fill="#ffffff"/>
      <rect x="58.5" y="14.5" width="23" height="18" rx="1" fill="url(#ps-b)"/>
    </g>
    <!-- mid-top -->
    <g transform="rotate(-6 49 22)">
      <rect x="35" y="8" width="28" height="26" rx="2" fill="#ffffff"/>
      <rect x="37.5" y="10.5" width="23" height="18" rx="1" fill="url(#ps-a)"/>
    </g>
    <!-- outer card that glides IN from the left on a loop -->
    <g transform="rotate(-22 18 34)">
      <rect x="4" y="21" width="26" height="24" rx="2" fill="#ffffff"/>
      <rect x="6.5" y="23.5" width="21" height="16" rx="1" fill="url(#ps-e)"/>
      <animateTransform attributeName="transform" type="translate" values="-22 6; 0 0; 0 0; -22 6" keyTimes="0;0.3;0.8;1" dur="3.6s" additive="sum" repeatCount="indefinite"/>
    </g>
    <!-- front-centre (on top) -->
    <g transform="rotate(8 50 44)">
      <rect x="36" y="31" width="30" height="27" rx="2" fill="#ffffff"/>
      <rect x="38.5" y="33.5" width="25" height="19" rx="1" fill="url(#ps-c)"/>
    </g>
    <!-- outer card that glides IN from the right on a loop -->
    <g transform="rotate(20 80 46)">
      <rect x="68" y="34" width="26" height="24" rx="2" fill="#ffffff"/>
      <rect x="70.5" y="36.5" width="21" height="16" rx="1" fill="url(#ps-b)"/>
      <animateTransform attributeName="transform" type="translate" values="22 8; 0 0; 0 0; 22 8" keyTimes="0;0.3;0.8;1" dur="3.6s" begin="0.4s" additive="sum" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
