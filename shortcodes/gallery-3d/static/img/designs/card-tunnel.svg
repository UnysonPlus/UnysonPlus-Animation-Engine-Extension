<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
  <defs>
    <linearGradient id="ct-f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/>
    </linearGradient>
  </defs>
  <!-- Card Tunnel: concentric rings scale up from the vanishing point toward the mouth and fade,
       a perspective fly-through of the four card walls. -->
  <g transform="translate(48,32)">
    <g>
      <rect x="-22" y="-13.5" width="44" height="27" rx="3" fill="none" stroke="url(#ct-f)" stroke-width="2"/>
      <animateTransform attributeName="transform" type="scale" dur="3.0s" begin="0.00s" repeatCount="indefinite" keyTimes="0;1" values="0.14;2.4"/>
      <animate attributeName="opacity" dur="3.0s" begin="0.00s" repeatCount="indefinite" keyTimes="0;0.15;0.8;1" values="0;0.95;0.9;0"/>
    </g>
    <g>
      <rect x="-22" y="-13.5" width="44" height="27" rx="3" fill="none" stroke="url(#ct-f)" stroke-width="2"/>
      <animateTransform attributeName="transform" type="scale" dur="3.0s" begin="-0.60s" repeatCount="indefinite" keyTimes="0;1" values="0.14;2.4"/>
      <animate attributeName="opacity" dur="3.0s" begin="-0.60s" repeatCount="indefinite" keyTimes="0;0.15;0.8;1" values="0;0.95;0.9;0"/>
    </g>
    <g>
      <rect x="-22" y="-13.5" width="44" height="27" rx="3" fill="none" stroke="url(#ct-f)" stroke-width="2"/>
      <animateTransform attributeName="transform" type="scale" dur="3.0s" begin="-1.20s" repeatCount="indefinite" keyTimes="0;1" values="0.14;2.4"/>
      <animate attributeName="opacity" dur="3.0s" begin="-1.20s" repeatCount="indefinite" keyTimes="0;0.15;0.8;1" values="0;0.95;0.9;0"/>
    </g>
    <g>
      <rect x="-22" y="-13.5" width="44" height="27" rx="3" fill="none" stroke="url(#ct-f)" stroke-width="2"/>
      <animateTransform attributeName="transform" type="scale" dur="3.0s" begin="-1.80s" repeatCount="indefinite" keyTimes="0;1" values="0.14;2.4"/>
      <animate attributeName="opacity" dur="3.0s" begin="-1.80s" repeatCount="indefinite" keyTimes="0;0.15;0.8;1" values="0;0.95;0.9;0"/>
    </g>
    <g>
      <rect x="-22" y="-13.5" width="44" height="27" rx="3" fill="none" stroke="url(#ct-f)" stroke-width="2"/>
      <animateTransform attributeName="transform" type="scale" dur="3.0s" begin="-2.40s" repeatCount="indefinite" keyTimes="0;1" values="0.14;2.4"/>
      <animate attributeName="opacity" dur="3.0s" begin="-2.40s" repeatCount="indefinite" keyTimes="0;0.15;0.8;1" values="0;0.95;0.9;0"/>
    </g>
  </g>
</svg>
