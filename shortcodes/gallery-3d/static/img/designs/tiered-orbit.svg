<!-- Tiered Orbit: three stacked rings tapering like a tree, neighbouring tiers turning opposite ways. Original design. -->
<use href="#ti-a" stroke="#8fbcff" stroke-opacity=".4" stroke-width="1.2"/>
<use href="#ti-b" stroke="#8fbcff" stroke-opacity=".4" stroke-width="1.2"/>
<use href="#ti-c" stroke="#8fbcff" stroke-opacity=".4" stroke-width="1.2"/>
<rect x="-3.5" y="-3.5" width="7" height="7" rx="1.3" fill="url(#ti-f)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#ti-a"/></animateMotion></rect>
<rect x="-3.5" y="-3.5" width="7" height="7" rx="1.3" fill="url(#ti-f)"><animateMotion dur="4s" begin="-2s" repeatCount="indefinite"><mpath href="#ti-a"/></animateMotion></rect>
<rect x="-3.5" y="-3.5" width="7" height="7" rx="1.3" fill="url(#ti-f)"><animateMotion dur="5s" keyPoints="1;0" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"><mpath href="#ti-b"/></animateMotion></rect>
<rect x="-3.5" y="-3.5" width="7" height="7" rx="1.3" fill="url(#ti-f)"><animateMotion dur="5s" begin="-2.5s" keyPoints="1;0" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"><mpath href="#ti-b"/></animateMotion></rect>
<rect x="-3.5" y="-3.5" width="7" height="7" rx="1.3" fill="url(#ti-f)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#ti-c"/></animateMotion></rect>
<rect x="-3.5" y="-3.5" width="7" height="7" rx="1.3" fill="url(#ti-f)"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#ti-c"/></animateMotion></rect>
<rect x="-3.5" y="-3.5" width="7" height="7" rx="1.3" fill="url(#ti-f)"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath href="#ti-c"/></animateMotion></rect>
</svg>
