<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs>
  <linearGradient id="ti-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient>
  <path id="ti-a" d="M64,14 A16,4 0 1,1 32,14 A16,4 0 1,1 64,14"/>
  <path id="ti-b" d="M71,32 A23,5.5 0 1,1 25,32 A23,5.5 0 1,1 71,32"/>
  <path id="ti-c" d="M78,50 A30,7 0 1,1 18,50 A30,7 0 1,1 78,50"/>
