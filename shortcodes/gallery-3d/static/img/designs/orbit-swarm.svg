<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs><linearGradient id="os-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient></defs>
<!-- Orbit Swarm: a cloud of small cards, each on its own orbit and pace, gathering and scattering. Original design. -->
<g transform="translate(48,32) scale(1,0.55)">
  <g><animateTransform attributeName="transform" type="rotate" dur="9s" repeatCount="indefinite" from="0" to="360"/>
    <rect x="30" y="-4" width="8" height="8" rx="1.5" fill="url(#os-f)"/><rect x="-38" y="-4" width="8" height="8" rx="1.5" fill="url(#os-f)"/>
    <rect x="-4" y="28" width="8" height="8" rx="1.5" fill="url(#os-f)"/></g>
  <g><animateTransform attributeName="transform" type="rotate" dur="6s" repeatCount="indefinite" from="40" to="400"/>
    <rect x="20" y="-4" width="8" height="8" rx="1.5" fill="url(#os-f)" opacity=".85"/><rect x="-28" y="-4" width="8" height="8" rx="1.5" fill="url(#os-f)" opacity=".85"/>
    <rect x="-4" y="-28" width="8" height="8" rx="1.5" fill="url(#os-f)" opacity=".85"/></g>
  <g><animateTransform attributeName="transform" type="rotate" dur="4s" repeatCount="indefinite" from="100" to="460"/>
    <rect x="9" y="-4" width="8" height="8" rx="1.5" fill="url(#os-f)" opacity=".7"/><rect x="-17" y="-4" width="8" height="8" rx="1.5" fill="url(#os-f)" opacity=".7"/></g>
  <animateTransform attributeName="transform" type="scale" additive="sum" dur="5s" repeatCount="indefinite" keyTimes="0;0.5;1" values="1;0.7;1"/>
</g>
</svg>
