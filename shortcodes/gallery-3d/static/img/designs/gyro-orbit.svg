<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs>
  <linearGradient id="gy-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient>
  <radialGradient id="gy-c"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#ffd98a" stop-opacity=".7"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient>
  <path id="gy-p0" d="M78,32 A30,10 0 1,1 18,32 A30,10 0 1,1 78,32"/>
</defs>
<!-- Gyro Orbit: cards travelling three crossed rings around a glowing core, like an atom. Original design. -->
<circle cx="48" cy="32" r="8" fill="url(#gy-c)"/>
<g transform="rotate(0 48 32)"><use href="#gy-p0" stroke="#8fbcff" stroke-opacity=".4" stroke-width="1.3"/>
  <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="url(#gy-f)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#gy-p0"/></animateMotion></rect></g>
<g transform="rotate(60 48 32)"><use href="#gy-p0" stroke="#8fbcff" stroke-opacity=".4" stroke-width="1.3"/>
  <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="url(#gy-f)"><animateMotion dur="4.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#gy-p0"/></animateMotion></rect></g>
<g transform="rotate(120 48 32)"><use href="#gy-p0" stroke="#8fbcff" stroke-opacity=".4" stroke-width="1.3"/>
  <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="url(#gy-f)"><animateMotion dur="5.2s" begin="-2s" repeatCount="indefinite"><mpath href="#gy-p0"/></animateMotion></rect></g>
</svg>
