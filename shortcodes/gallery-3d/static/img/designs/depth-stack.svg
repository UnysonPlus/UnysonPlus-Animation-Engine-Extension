<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
  <defs>
    <linearGradient id="dz-f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/>
    </linearGradient>
  </defs>
  <!-- Depth Stack: a deck of cards receding into depth; the front flies forward and fades as the
       next comes up, recycling to the back. -->
  <g transform="translate(48,32)">
    <g>
      <rect x="-13" y="-16" width="26" height="32" rx="3" fill="url(#dz-f)" transform="rotate(-4)">
        <animate attributeName="opacity" dur="3.2s" begin="0.00s" repeatCount="indefinite" keyTimes="0;0.12;0.82;1" values="0;0.9;0.9;0"/>
      </rect>
      <animateTransform attributeName="transform" type="scale" dur="3.2s" begin="0.00s" repeatCount="indefinite" keyTimes="0;1" values="0.32;1.55"/>
    </g>
    <g>
      <rect x="-13" y="-16" width="26" height="32" rx="3" fill="url(#dz-f)" transform="rotate(4)">
        <animate attributeName="opacity" dur="3.2s" begin="-0.64s" repeatCount="indefinite" keyTimes="0;0.12;0.82;1" values="0;0.9;0.9;0"/>
      </rect>
      <animateTransform attributeName="transform" type="scale" dur="3.2s" begin="-0.64s" repeatCount="indefinite" keyTimes="0;1" values="0.32;1.55"/>
    </g>
    <g>
      <rect x="-13" y="-16" width="26" height="32" rx="3" fill="url(#dz-f)" transform="rotate(-4)">
        <animate attributeName="opacity" dur="3.2s" begin="-1.28s" repeatCount="indefinite" keyTimes="0;0.12;0.82;1" values="0;0.9;0.9;0"/>
      </rect>
      <animateTransform attributeName="transform" type="scale" dur="3.2s" begin="-1.28s" repeatCount="indefinite" keyTimes="0;1" values="0.32;1.55"/>
    </g>
    <g>
      <rect x="-13" y="-16" width="26" height="32" rx="3" fill="url(#dz-f)" transform="rotate(4)">
        <animate attributeName="opacity" dur="3.2s" begin="-1.92s" repeatCount="indefinite" keyTimes="0;0.12;0.82;1" values="0;0.9;0.9;0"/>
      </rect>
      <animateTransform attributeName="transform" type="scale" dur="3.2s" begin="-1.92s" repeatCount="indefinite" keyTimes="0;1" values="0.32;1.55"/>
    </g>
    <g>
      <rect x="-13" y="-16" width="26" height="32" rx="3" fill="url(#dz-f)" transform="rotate(-4)">
        <animate attributeName="opacity" dur="3.2s" begin="-2.56s" repeatCount="indefinite" keyTimes="0;0.12;0.82;1" values="0;0.9;0.9;0"/>
      </rect>
      <animateTransform attributeName="transform" type="scale" dur="3.2s" begin="-2.56s" repeatCount="indefinite" keyTimes="0;1" values="0.32;1.55"/>
    </g>
  </g>
</svg>
