<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs><linearGradient id="mo-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient>
  <g id="mo-sys">
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="url(#mo-f)"/>
    <g><animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite" from="0" to="360"/>
      <rect x="7" y="-2.5" width="5" height="5" rx="1" fill="url(#mo-f)" opacity=".85"/>
      <rect x="-12" y="-2.5" width="5" height="5" rx="1" fill="url(#mo-f)" opacity=".85"/></g>
  </g>
</defs>
<!-- Moon Orbit: big planet cards on the main orbit, each circled by smaller, faster moon cards. Original design. -->
<g transform="translate(48,32)">
  <g><animateTransform attributeName="transform" type="rotate" dur="9s" repeatCount="indefinite" from="0" to="360"/>
    <g transform="translate(28,0)"><g><animateTransform attributeName="transform" type="rotate" dur="9s" repeatCount="indefinite" from="0" to="-360"/><use href="#mo-sys"/></g></g>
    <g transform="translate(-28,0)"><g><animateTransform attributeName="transform" type="rotate" dur="9s" repeatCount="indefinite" from="0" to="-360"/><use href="#mo-sys"/></g></g>
    <g transform="translate(0,20)"><g><animateTransform attributeName="transform" type="rotate" dur="9s" repeatCount="indefinite" from="0" to="-360"/><use href="#mo-sys"/></g></g>
    <g transform="translate(0,-20)"><g><animateTransform attributeName="transform" type="rotate" dur="9s" repeatCount="indefinite" from="0" to="-360"/><use href="#mo-sys"/></g></g>
  </g>
</g>
</svg>
