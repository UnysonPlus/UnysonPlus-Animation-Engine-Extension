<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs>
  <linearGradient id="rt-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient>
  <radialGradient id="rt-p" cx=".35" cy=".3"><stop offset="0" stop-color="#e6f0ff"/><stop offset=".4" stop-color="#5b95f0"/><stop offset="1" stop-color="#173f8a"/></radialGradient>
  <clipPath id="rt-back"><rect x="0" y="0" width="96" height="32"/></clipPath>
  <clipPath id="rt-front"><rect x="0" y="32" width="96" height="32"/></clipPath>
</defs>
<!-- Ring Tilt: flat tiles lying in a steeply tilted ring around a planet, rocking gently. Original design. -->
<g>
  <animateTransform attributeName="transform" type="rotate" dur="6s" repeatCount="indefinite" keyTimes="0;0.5;1" values="-6 48 32;6 48 32;-6 48 32"/>
  <g clip-path="url(#rt-back)"><g transform="translate(48,32) scale(1,0.26)">
    <g><animateTransform attributeName="transform" type="rotate" dur="10s" repeatCount="indefinite" from="0" to="360"/>
      <rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" opacity=".55" transform="rotate(0)"/><rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" opacity=".55" transform="rotate(45)"/>
      <rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" opacity=".55" transform="rotate(90)"/><rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" opacity=".55" transform="rotate(135)"/>
      <rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" opacity=".55" transform="rotate(180)"/><rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" opacity=".55" transform="rotate(225)"/>
      <rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" opacity=".55" transform="rotate(270)"/><rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" opacity=".55" transform="rotate(315)"/>
    </g></g></g>
  <circle cx="48" cy="32" r="12" fill="url(#rt-p)"/>
  <g clip-path="url(#rt-front)"><g transform="translate(48,32) scale(1,0.26)">
    <g><animateTransform attributeName="transform" type="rotate" dur="10s" repeatCount="indefinite" from="0" to="360"/>
      <rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" transform="rotate(0)"/><rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" transform="rotate(45)"/>
      <rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" transform="rotate(90)"/><rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" transform="rotate(135)"/>
      <rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" transform="rotate(180)"/><rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" transform="rotate(225)"/>
      <rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" transform="rotate(270)"/><rect x="31" y="-6" width="10" height="12" rx="1.5" fill="url(#rt-f)" transform="rotate(315)"/>
    </g></g></g>
</g>
</svg>
