<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs>
  <linearGradient id="mg-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient>
  <linearGradient id="mg-h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6e6ff"/><stop offset="1" stop-color="#5b95f0"/></linearGradient>
</defs>
<!-- Magnet Grid: the cards nearest the pointer lift and grow toward it as it drifts. Original design. -->
<g fill="url(#mg-f)" opacity=".75">
  <rect x="14" y="8" width="13" height="13" rx="2"/><rect x="31" y="8" width="13" height="13" rx="2"/><rect x="48" y="8" width="13" height="13" rx="2"/><rect x="65" y="8" width="13" height="13" rx="2"/>
  <rect x="14" y="25" width="13" height="13" rx="2"/><rect x="31" y="25" width="13" height="13" rx="2"/><rect x="48" y="25" width="13" height="13" rx="2"/><rect x="65" y="25" width="13" height="13" rx="2"/>
  <rect x="14" y="42" width="13" height="13" rx="2"/><rect x="31" y="42" width="13" height="13" rx="2"/><rect x="48" y="42" width="13" height="13" rx="2"/><rect x="65" y="42" width="13" height="13" rx="2"/>
</g>
<!-- the lifted card follows the drifting pointer from cell to cell -->
<rect x="-9" y="-9" width="18" height="18" rx="2.5" fill="url(#mg-h)">
  <animateMotion dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1" values="20.5,14.5;54.5,31.5;71.5,14.5;37.5,48.5;20.5,14.5"/>
</rect>
<g>
  <animateMotion dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1" values="26,20;60,37;77,20;43,54;26,20"/>
  <path d="M0,0 L0,9 L2.5,6.8 L4.6,11 L6.2,10.2 L4.2,6.2 L7.4,6 Z" fill="#fff" stroke="#1d2a44" stroke-width=".8" stroke-linejoin="round"/>
</g>
</svg>
