<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
<defs><linearGradient id="A" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient><linearGradient id="B" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3eeff"/><stop offset="1" stop-color="#7aa9f2"/></linearGradient><clipPath id="fr"><rect x="16" y="13" width="64" height="38" rx="3"/></clipPath></defs>
<!-- Iris Wipe: the next photo opens up over the current one through a growing circle. Original design. -->
<g clip-path="url(#fr)"><rect x="16" y="13" width="64" height="38" fill="url(#A)"/><circle cx="48" cy="32" r="0" fill="url(#B)"><animate attributeName="r" dur="3s" repeatCount="indefinite" keyTimes="0;0.15;0.6;1" values="0;0;40;40" calcMode="spline" keySplines="0 0 1 1;.5 0 .5 1;0 0 1 1"/></circle></g>
</svg>
