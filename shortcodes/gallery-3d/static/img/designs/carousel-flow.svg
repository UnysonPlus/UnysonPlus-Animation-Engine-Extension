<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
  <defs><linearGradient id="caf-f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/></linearGradient></defs>
  <!-- Carousel Flow: full-size centre card, scaled-down faded side cards. -->
  <g>
    <rect x="6" y="24" width="18" height="18" rx="2.5" fill="url(#caf-f)" opacity="0.45"/>
    <rect x="72" y="24" width="18" height="18" rx="2.5" fill="url(#caf-f)" opacity="0.45"/>
    <rect x="33" y="15" width="30" height="34" rx="3" fill="url(#caf-f)"/>
    <animateTransform attributeName="transform" type="translate" dur="4s" begin="0s" repeatCount="indefinite" keyTimes="0;0.5;1" values="-3 0;3 0;-3 0"/>
  </g>
</svg>
