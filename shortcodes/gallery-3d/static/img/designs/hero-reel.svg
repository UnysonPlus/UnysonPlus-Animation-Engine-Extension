<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
  <defs>
    <linearGradient id="hr-f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/>
    </linearGradient>
    <clipPath id="hr-clip"><rect x="0" y="0" width="96" height="64" rx="4"/></clipPath>
  </defs>
  <!-- Hero Reel: a reel of thumbnails over a dimmed hero (the active/centre card fills the stage). -->
  <g clip-path="url(#hr-clip)">
    <!-- hero background (dimmed) -->
    <rect x="0" y="0" width="96" height="64" fill="url(#hr-f)" opacity="0.28"/>
    <rect x="0" y="0" width="96" height="64" fill="#101014" opacity="0.45"/>
    <!-- the reel: five thumbnails, the centre one bigger + lifted (the active card) -->
    <g fill="url(#hr-f)">
      <rect x="6"  y="26" width="14" height="12" rx="2" opacity="0.85"/>
      <rect x="23" y="26" width="14" height="12" rx="2" opacity="0.9"/>
      <rect x="39" y="21" width="18" height="16" rx="2.5">
        <animate attributeName="y" values="21;19;21" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="height" values="16;18;16" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="59" y="26" width="14" height="12" rx="2" opacity="0.9"/>
      <rect x="76" y="26" width="14" height="12" rx="2" opacity="0.85"/>
    </g>
  </g>
</svg>
