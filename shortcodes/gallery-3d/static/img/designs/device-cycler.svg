<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
  <defs>
    <linearGradient id="dc-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fbcff"/><stop offset="1" stop-color="#2f74e6"/>
    </linearGradient>
  </defs>
  <!-- Device Cycler: a laptop whose screen steps through view modes (grid → list → gallery). -->
  <!-- laptop base -->
  <rect x="20" y="47" width="56" height="4" rx="2" fill="#a7abb4"/>
  <!-- laptop screen bezel -->
  <rect x="26" y="12" width="44" height="34" rx="4" fill="#1c1c1f"/>
  <rect x="30" y="16" width="36" height="26" rx="2" fill="#0b0b0d"/>
  <!-- grid view (screen 1) -->
  <g>
    <rect x="33" y="19" width="9" height="7" rx="1" fill="url(#dc-b)"/>
    <rect x="44" y="19" width="9" height="7" rx="1" fill="#5b8def"/>
    <rect x="55" y="19" width="8" height="7" rx="1" fill="#8fbcff"/>
    <rect x="33" y="28" width="9" height="7" rx="1" fill="#5b8def"/>
    <rect x="44" y="28" width="9" height="7" rx="1" fill="#8fbcff"/>
    <rect x="55" y="28" width="8" height="7" rx="1" fill="url(#dc-b)"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="3.6s" repeatCount="indefinite"/>
  </g>
  <!-- list view (screen 2) -->
  <g opacity="0">
    <rect x="33" y="19" width="30" height="4" rx="1" fill="url(#dc-b)"/>
    <rect x="33" y="25" width="30" height="4" rx="1" fill="#5b8def"/>
    <rect x="33" y="31" width="30" height="4" rx="1" fill="#8fbcff"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="3.6s" repeatCount="indefinite"/>
  </g>
</svg>
